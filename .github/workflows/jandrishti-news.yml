name: Refresh JanDrishti constituency news

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jandrishti-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh local news snapshot
        run: node jandrishti/tools/refresh-news.mjs --output jandrishti/data/news-summary.json
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- jandrishti/data/news-summary.json; then
            echo "News snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jandrishti/data/news-summary.json
          git commit -m "Refresh JanDrishti constituency news"
          git push origin HEAD:main
