function render(){document.getElementById('crumb').textContent=page;document.getElementById('agentstate').textContent='Demo agent '+state.mode;document.getElementById('nav').innerHTML=['Overview','Leads','Campaigns','Inbox','Discovery','Assets','Activity','Settings'].map(n=>'<button class="'+(page===n?'active':'')+'" onclick="go(\''+n+'\')">'+icon(n)+n+(n==='Inbox'?'<span class="count">'+state.messages.length+'</span>':'')+'</button>').join('');document.getElementById('app').innerHTML=(state.mode!=='running'?'<div class="statebanner">'+(state.mode==='stopped'?'Kill switch engaged. All pending demo jobs are cancelled.':'Dispatch paused. No demo messages will be sent.')+' '+action('Resume',"setMode('running')",'textbtn')+'</div>':'')+({Overview:overview,Leads:leadsView,Campaigns:campaignsView,Inbox:inboxView,Discovery:discoveryView,Assets:assetsView,Activity:activityView,Settings:settingsView}[page]())+'<footer class="footer"><span>JSI Software Solutions · Outreach Agent v0.1</span><span class="health"><span class="dot" style="color:#a596c4"></span>Demo data · Browser-local state · No live sends</span></footer>'}
function setMode(m){state.mode=m;if(m==='stopped'){state.jobs.forEach(j=>{if(['queued','pending_review'].includes(j.status))j.status='cancelled'});state.drafts.forEach(d=>{if(d.status==='pending_review')d.status='cancelled'});state.leads.filter(l=>l.status==='queued').forEach(l=>{l.status='review';l.eligible=false})}log('Agent '+m+(m==='stopped'?'; pending jobs cancelled':''),'Agent');render();toast('Demo agent '+m)}
function kill(){openModal('Stop all outreach','<p style="line-height:1.8">This will stop demo dispatch and cancel every queued or pending demo job. Cancelled jobs stay cancelled when the agent resumes. Queued leads return to review and require eligibility approval again.</p>',action('Keep running','closeModal()')+action('Stop & cancel queue',"setMode('stopped');closeModal()",'danger'))}
function overview(){const rolling=state.sent.filter(x=>Date.now()-new Date(x.at)<86400000).length;return heading('A little outreach. A lot of possibility.','Build meaningful school connections, one conversation at a time.',action('↓ Import leads','importModal()')+action(state.mode==='running'?'Ⅱ Pause agent':'▷ Resume agent',"setMode('"+(state.mode==='running'?'paused':'running')+"')",'primary'))+'<section class="hero"><div><span class="pill">✧ HUMAN-SUPERVISED. AI-ASSISTED.</span><h2>Your next school partnership starts here.</h2><p>Discover the right schools, make a thoughtful introduction, and let every reply shape what happens next.</p>'+action('Explore the agent workflow ↗',"go('Discovery')")+'</div><div class="orbit" aria-hidden="true"><i class="orbdot"></i><div class="orbcore">✉</div><i class="orbdot"></i></div></section><div class="stats">'+[['Total leads',state.leads.length,'Reviewed, imported & discovered','◎'],['Demo sends · 24 hours',rolling,'of '+state.settings.cap+' allowed per sender','↗'],['Conversations',state.leads.filter(l=>l.status==='replied').length,'Replies stop follow-ups automatically','↩'],['Awaiting review',state.leads.filter(l=>l.status==='review').length+state.campaigns.filter(c=>c.status==='pending_review').length+state.drafts.filter(d=>d.status==='pending_review').length,'Your approval makes the next move','◷']].map(a=>'<div class="stat"><div class="statlabel">'+a[0]+'<span>'+a[3]+'</span></div><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('')+'</div><div class="grid"><section class="card"><div class="cardhead"><div><h2>Outreach activity</h2><p>Your demo dispatch & reply events</p></div><span class="pill">Last 7 days</span></div><div class="cardbody">'+chart()+'</div></section><section class="card"><div class="cardhead"><div><h2>A healthier lead pipeline</h2><p>Every school has a next step</p></div><span class="muted">⌁</span></div><div class="cardbody">'+[['Ready to contact',state.leads.filter(l=>l.status==='queued').length],['Introductions sent',state.leads.filter(l=>l.status==='sent').length],['In conversation',state.leads.filter(l=>l.status==='replied').length],['Follow-up due',state.leads.filter(l=>l.status==='followup_due').length]].map((a,i)=>'<div class="funnelrow"><span>'+a[0]+'</span><div class="track"><div class="fill" style="width:'+Math.round(a[1]/Math.max(1,state.leads.length)*100)+'%;background:'+['#b19bdf','#bfb2e3','#9bc5b2','#e5c58c'][i]+'"></div></div><b>'+a[1]+'</b></div>').join('')+'</div></section></div><div class="grid"><section class="card"><div class="cardhead"><div><h2>Campaigns in motion</h2><p>Thoughtful introductions, intentional follow-ups</p></div>'+action('View all →',"go('Campaigns')",'textbtn')+'</div>'+campaignTable()+'</section><section class="card"><div class="cardhead"><h2>Latest from your workspace</h2>'+action('See all →',"go('Activity')",'textbtn')+'</div><div class="cardbody">'+state.events.slice(0,3).map((e,i)=>'<div class="activity"><div class="activityicon">'+['↩','✓','◎'][i]+'</div><div><p>'+E(e.action)+'</p><small>'+new Date(e.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+E(e.target)+'</small></div></div>').join('')+'</div></section></div><div class="notice">Try the complete loop: import or review a lead → approve a campaign → simulate a send → simulate a reply. Every action updates this workspace.</div>'}
function chart(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});const vals=days.map(d=>[state.sent.filter(s=>new Date(s.at).toDateString()===d.toDateString()).length,state.messages.filter(s=>new Date(s.at).toDateString()===d.toDateString()).length]);const max=Math.max(4,...vals.flat());return '<div class="chartlegend"><span><i></i>Demo emails sent</span><span><i></i>Replies</span></div><div class="chart"><div class="yaxis"><span>'+max+'</span><span>'+Math.floor(max/2)+'</span><span>0</span></div><div class="plot">'+days.map((d,i)=>'<div class="bargroup" title="'+vals[i][0]+' sent, '+vals[i][1]+' replies"><div class="bar" style="height:'+vals[i][0]/max*130+'px"></div><div class="bar reply" style="height:'+vals[i][1]/max*130+'px"></div><small>'+d.toLocaleDateString('en',{weekday:'short'})+'</small></div>').join('')+'</div></div>'}
function campaignTable(){return '<div class="tablewrap"><table><thead><tr><th>CAMPAIGN</th><th>STATUS</th><th>DAILY CAP</th><th></th></tr></thead><tbody>'+state.campaigns.map(c=>'<tr><td><strong>'+E(c.name)+'</strong><small>'+E(c.segment)+'</small></td><td>'+badge(c.status)+'</td><td>'+c.cap+' / day</td><td>'+action('Open →',"campaignModal('"+c.id+"')",'textbtn')+'</td></tr>').join('')+'</tbody></table></div>'}
function filteredLeads(){return state.leads.filter(l=>(!filter||l.status===filter)&&(!query||[l.school,l.email,l.city].join(' ').toLowerCase().includes(query.toLowerCase())))}
function leadsView(){return heading('A school. A conversation. A connection.','Keep your leads organized, reviewed, and ready for the right next step.',action('Export CSV','exportLeads()')+action('+ Add lead','leadModal()', 'primary'))+'<div class="leadsummary"><span>'+state.leads.length+' total leads</span><span>'+state.leads.filter(l=>l.status==='review').length+' need review</span><span>'+state.leads.filter(l=>['unsubscribed','suppressed','bounced'].includes(l.status)).length+' excluded from outreach</span></div><section class="card"><div class="toolbar"><input type="search" placeholder="Search schools, cities or email…" aria-label="Search leads" value="'+E(query)+'" oninput="query=this.value;refreshLeadRows()"><select aria-label="Filter lifecycle status" onchange="filter=this.value;refreshLeadRows()"><option value="">All statuses</option>'+['new','review','queued','sent','replied','followup_due','unsubscribed','suppressed','bounced'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+action('↓ Import CSV','importModal()')+'</div><div id="leadrows">'+leadRows()+'</div></section><p class="metricnote">Public prototype: use fictional data only. Lead records stay in this browser.</p>'}
function leadRows(){const arr=filteredLeads();return '<div class="tablewrap"><table><thead><tr><th>SCHOOL / CONTACT</th><th>CITY</th><th>LIFECYCLE</th><th>SOURCE</th><th></th></tr></thead><tbody>'+arr.map(l=>'<tr><td><strong>'+E(l.school)+'</strong><small>'+E(l.email)+'</small></td><td>'+E(l.city)+'</td><td>'+badge(l.status)+'</td><td>'+E(l.source)+'</td><td>'+action('Details →',"leadModal('"+l.id+"')",'textbtn')+'</td></tr>').join('')+'</tbody></table></div>'+(!arr.length?'<div class="empty">No leads match this search.</div>':'')}
function refreshLeadRows(){document.getElementById('leadrows').innerHTML=leadRows()}
function openModal(title,body,foot=''){const d=document.getElementById('modal');d.innerHTML='<div class="modalhead"><h2>'+title+'</h2><button aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="modalbody">'+body+'</div>'+(foot?'<div class="modalfoot">'+foot+'</div>':'');d.showModal()}
function closeModal(){document.getElementById('modal').close()}
const field=(label,name,value='',type='text',extra='')=>'<div class="field '+extra+'"><label for="'+name+'">'+label+'</label><input id="'+name+'" type="'+type+'" value="'+E(value)+'"></div>';
function leadModal(id){const l=state.leads.find(l=>l.id===id);openModal(l?'School & lead details':'Add a school lead','<div class="formgrid">'+field('School name *','school',l?.school)+field('Contact email *','email',l?.email,'email')+field('City *','city',l?.city)+(l?'<div class="field"><label>Lifecycle status</label><div>'+badge(l.status)+'</div></div>':'')+'<div class="field wide"><label for="notes">Notes</label><textarea id="notes">'+E(l?.notes||'')+'</textarea></div></div>'+(l?'<p class="metricnote">Source: '+E(l.source)+(l.url?' · '+E(l.url):'')+'<br>Follow-ups sent: '+l.count+' · Eligible for review: '+(l.eligible?'yes':'no')+'</p>':'<div class="notice" style="margin-top:18px">New leads require review before demo dispatch.</div>')+(l?'<div class="actions" style="margin-top:20px;flex-wrap:wrap">'+(['new','review'].includes(l.status)?action('Review eligibility',"reviewLead('"+id+"')",'primary'):'')+(!['unsubscribed','suppressed'].includes(l.status)?action('Suppress lead',"changeLead('"+id+"','suppressed');closeModal()",'danger'):'')+(!['unsubscribed','suppressed','bounced'].includes(l.status)?action('Simulate reply',"simulateReply('"+id+"');closeModal()")+action('Simulate opt-out',"changeLead('"+id+"','unsubscribed');closeModal()"):'')+'</div>':''),action('Cancel','closeModal()')+action('Save lead',"saveLead('"+(id||'')+"')",'primary'))}
function validEmail(s){return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(s)}
function saveLead(id){const school=document.getElementById('school').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),city=document.getElementById('city').value.trim(),notes=document.getElementById('notes').value.trim();if(!school||!city||!validEmail(email))return toast('Enter a school, city, and valid email address.');if(state.leads.some(l=>l.email===email&&l.id!==id))return toast('That normalized email already exists.');let l=state.leads.find(l=>l.id===id);if(l){if(l.email!==email)return toast('Contact email is immutable in this prototype; create a separate reviewed lead.');Object.assign(l,{school,city,notes})}else state.leads.push({id:uid(),school,email,city,notes,status:'review',source:'Manual',eligible:false,count:0,lastSent:null});log((l?'Updated ':'Added ')+school,'Leads');closeModal();render();toast('Lead saved')}
function changeLead(id,status){const l=state.leads.find(l=>l.id===id);if(!l)return;if(['unsubscribed','suppressed'].includes(l.status)&&status!==l.status)return toast('Opted-out and suppressed leads cannot be reactivated.');l.status=status;if(['replied','unsubscribed','suppressed','bounced'].includes(status))state.jobs.filter(j=>j.lead===id&&['queued','pending_review'].includes(j.status)).forEach(j=>j.status='cancelled');state.drafts.filter(d=>d.lead===id&&d.status==='pending_review').forEach(d=>d.status='cancelled');log(l.school+' marked '+status+'; pending follow-ups cancelled','Leads');render()}
function reviewLead(id){const l=state.leads.find(l=>l.id===id);openModal('Review recipient eligibility','<p style="line-height:1.8;margin-bottom:15px">Confirm the source and outreach eligibility for <strong>'+E(l.school)+'</strong>. Discovery alone does not make a contact eligible.</p><p class="metricnote">Source: '+E(l.url||l.source)+'</p><label style="font-size:12px;line-height:1.8;display:flex;gap:10px"><input type="checkbox" id="eligible"> I reviewed this demo contact’s source, lawful basis / applicable consent, and suppression status.</label>',action('Cancel','closeModal()')+action('Approve demo lead',"approveLead('"+id+"')",'primary'))}
function approveLead(id){if(!document.getElementById('eligible').checked)return toast('Confirm the eligibility review first.');const l=state.leads.find(l=>l.id===id);if(!['new','review'].includes(l.status))return toast('This lead cannot be reactivated.');l.eligible=true;l.status='queued';if(!state.jobs.some(j=>j.lead===id&&j.status==='queued'))state.jobs.push({id:uid(),lead:id,status:'queued'});log('Eligibility reviewed: '+l.school,'Leads');closeModal();render();toast('Lead reviewed and ready for an approved campaign')}
// RFC 4180-style CSV parsing, including escaped quotes and embedded newlines.
function parseCSV(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else if(q||v==='')q=!q;else throw Error('Unexpected quote in CSV')}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('Unclosed quoted CSV field');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
let importData=null;
function importModal(){importData=null;openModal('Import school leads','<div class="notice">CSV import with column mapping, validation and deduplication. Export Excel as CSV first. Maximum 2 MB / 5,000 rows. Use fictional contacts for this public demo.</div><div class="uploadzone"><strong>Bring your school list into one place</strong><p>Required columns: school_name, email, city</p><input type="file" id="csvfile" accept=".csv,text/csv" aria-label="Choose lead CSV" onchange="previewCSV(this.files[0])"></div><div id="importpreview"></div>',action('Download sample CSV','sampleCSV()')+action('Cancel','closeModal()')+'<button class="primary" id="importconfirm" disabled onclick="commitImport()">Import valid leads</button>')}
async function previewCSV(file){if(!file)return;if(file.size>2*1024*1024)return toast('CSV exceeds 2 MB.');try{const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(rows.length<2||rows.length>5001)throw Error('Use 1–5,000 data rows.');importData={headers:rows[0],rows:rows.slice(1)};document.getElementById('importpreview').innerHTML='<h3 style="margin:22px 0 16px">Map your columns</h3><div class="formgrid">'+['school_name','email','city'].map(k=>'<div class="field"><label>'+k+'</label><select id="map-'+k+'" onchange="updateImportPreview()">'+rows[0].map((h,i)=>'<option value="'+i+'" '+(h.trim().toLowerCase()===k?'selected':'')+'>'+E(h)+'</option>').join('')+'</select></div>').join('')+'</div><div id="importsummary" style="margin-top:18px"></div>';updateImportPreview()}catch(e){toast(e.message)}}
function validateImport(){const cols=['school_name','email','city'].map(k=>Number(document.getElementById('map-'+k).value));if(new Set(cols).size!==3)return {valid:[],duplicates:0,errors:['Map three distinct columns.']};const seen=new Set(state.leads.map(l=>l.email)),out={valid:[],duplicates:0,errors:[]};importData.rows.forEach((r,i)=>{const [school,email,city]=cols.map(c=>(r[c]||'').trim());const em=email.toLowerCase();if(!school||!city||!validEmail(em)){out.errors.push('Row '+(i+2)+': missing school/city or invalid email');return}if(seen.has(em)){out.duplicates++;return}seen.add(em);out.valid.push({school,email:em,city})});return out}
function updateImportPreview(){report=validateImport();document.getElementById('importsummary').innerHTML='<div class="notice">'+report.valid.length+' valid new leads · '+report.duplicates+' duplicates skipped · '+report.errors.length+' invalid rows<br>Existing opt-outs and suppressions are preserved.</div>'+report.errors.slice(0,5).map(e=>'<p class="metricnote">'+E(e)+'</p>').join('')+'<div class="tablewrap"><table><thead><tr><th>School</th><th>Email</th><th>City</th></tr></thead><tbody>'+report.valid.slice(0,4).map(l=>'<tr><td>'+E(l.school)+'</td><td>'+E(l.email)+'</td><td>'+E(l.city)+'</td></tr>').join('')+'</tbody></table></div>';document.getElementById('importconfirm').disabled=!report.valid.length}
function commitImport(){if(!importData)return;const r=validateImport();r.valid.forEach(l=>state.leads.push({...l,id:uid(),status:'review',eligible:false,source:'CSV import',notes:'',count:0,lastSent:null}));log('Imported '+r.valid.length+' leads; '+r.duplicates+' duplicates skipped, '+r.errors.length+' invalid rows','Import');closeModal();go('Leads');toast('Imported '+r.valid.length+' leads into review. No messages sent.')}
function download(name,text,type='text/csv'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function sampleCSV(){download('sample-school-leads.csv','school_name,email,city\nWillow Demo School,hello@willow.example,Kolkata\nAspen Demo Academy,office@aspen.example,Howrah\n')}
function exportLeads(){const rows=filteredLeads();download('outreach-leads.csv',[['school_name','email','city','status','source'],...rows.map(l=>[l.school,l.email,l.city,l.status,l.source])].map(r=>r.map(csvCell).join(',')).join('\r\n'));log('Exported '+rows.length+' filtered leads','Export');toast('Lead CSV downloaded')}
function campaignsView(){return heading('Every introduction deserves intention.','Write, review, approve. Then let the agent handle the rhythm.',action('+ New campaign','campaignModal()', 'primary'))+'<div class="notice">Prototype preflight is a simulation. SMTP, SPF, DKIM, DMARC and real recipient eligibility must be verified by the production backend before any live activation.</div><section class="card" style="margin-bottom:22px"><div class="cardhead"><h2>Your campaigns</h2><span class="pill">'+state.campaigns.length+' campaigns</span>'+'</div>'+campaignTable()+'</section><section class="card"><div class="cardhead"><div><h2>Agent dispatch sandbox</h2><p>Run one deliberate step at a time</p></div></div><div class="cardbody"><div class="actions" style="flex-wrap:wrap">'+action('Simulate one send','simulateSend()', 'primary')+action('Generate follow-up preview','draftFollowup()')+action('Emergency stop','kill()', 'danger')+'</div><p class="metricnote">Queue: '+state.jobs.filter(j=>j.status==='queued').length+' · Drafts needing approval: '+state.drafts.filter(d=>d.status==='pending_review').length+' · No connection to a mail provider</p>'+state.drafts.map(d=>'<div class="check"><span class="checkicon">✧</span><div style="flex:1"><b>'+E(state.leads.find(l=>l.id===d.lead)?.school)+'</b><small>'+E(d.body)+'</small><p style="margin-top:10px">'+badge(d.status)+' '+(d.status==='pending_review'?action('Review draft',"draftModal('"+d.id+"')",'textbtn'):'')+'</p></div></div>').join('')+'</div></section>'}
function campaignModal(id){const c=state.campaigns.find(c=>c.id===id);openModal(c?'Campaign studio':'Create campaign','<div class="formgrid">'+field('Campaign name *','cname',c?.name)+field('Daily campaign cap (1–50)','ccap',c?.cap||30,'number')+field('Subject * · use {{school_name}}','csubject',c?.subject||'An introduction for {{school_name}}','text','wide')+'<div class="field wide"><label for="cbody">Email body *</label><textarea id="cbody" style="min-height:210px">'+E(c?.body||'Hello {{school_name}} team,\n\nWe would welcome a conversation about your classroom needs.\n\nJSI Software Solutions\nContact: reply to this email\nTo opt out, reply “unsubscribe”.')+'</textarea><small>Editing content invalidates previous approval. Keep sender identity, contact details and opt-out instructions.</small></div></div>'+(c?'<div class="actions" style="margin-top:18px;flex-wrap:wrap">'+badge(c.status)+'<span class="muted" style="font-size:11px">Revision '+c.revision+'</span>'+action('Preview',"previewCampaign('"+id+"')")+(c.status==='pending_review'?action('Preflight & approval',"preflight('"+id+"')",'primary'):'')+(c.status==='active'?action('Pause campaign',"campaignStatus('"+id+"','paused');closeModal()"):'')+(c.status==='paused'?action('Resume demo campaign',"campaignStatus('"+id+"','active');closeModal()"):'')+(c.status==='draft'?action('Submit for review',"campaignStatus('"+id+"','pending_review');closeModal()"):'')+'</div>':''),action('Cancel','closeModal()')+action('Save revision',"saveCampaign('"+(id||'')+"')",'primary'))}
function saveCampaign(id){const name=document.getElementById('cname').value.trim(),cap=Number(document.getElementById('ccap').value),subject=document.getElementById('csubject').value.trim(),body=document.getElementById('cbody').value.trim();if(!name||!subject||!body||!Number.isInteger(cap)||cap<1||cap>50)return toast('Complete campaign fields; daily cap must be 1–50.');if(!/unsubscribe|opt.out/i.test(body)||!body.includes('JSI')||!(/contact|reply|@/i.test(body)))return toast('Include JSI sender identification, contact details, and unsubscribe instructions.');if(/{{(?!school_name}})[^}]+}}/.test(subject+body))return toast('Only {{school_name}} is supported in this prototype.');let c=state.campaigns.find(c=>c.id===id);if(c){const changed=c.name!==name||c.subject!==subject||c.body!==body||c.cap!==cap;if(changed){Object.assign(c,{name,subject,body,cap,status:'pending_review',revision:c.revision+1});state.jobs.filter(j=>j.campaign===id&&j.status==='queued').forEach(j=>j.status='cancelled')}}else state.campaigns.push({id:uid(),name,cap,subject,body,segment:'Reviewed school leads',status:'pending_review',revision:1});log('Campaign revision saved for review: '+name,'Campaigns');closeModal();render();toast('Campaign saved; approval required')}
function campaignStatus(id,s){const c=state.campaigns.find(c=>c.id===id);if(s==='active'&&!c.approvedAt)return toast('Approval required before activation.');c.status=s;log(c.name+' → '+s,'Campaigns');render()}
function previewCampaign(id){const c=state.campaigns.find(c=>c.id===id),l=state.leads[0];openModal('Rendered email preview','<div class="notice">Saved revision '+c.revision+' · Sample recipient: '+E(l.school)+'</div><h3 style="margin-bottom:16px">'+E(c.subject.replaceAll('{{school_name}}',l.school))+'</h3><div class="mail">'+E(c.body.replaceAll('{{school_name}}',l.school))+'</div>',action('Done','closeModal()'))}
function preflight(id){const c=state.campaigns.find(c=>c.id===id);openModal('Review & approve demo campaign','<div class="notice">These checks validate the demo content and policy only. Mail connectivity and domain authentication are not connected.</div>'+[['Sender identity','JSI Software Solutions identified'],['Opt-out mechanism','Reply-based unsubscribe included'],['Conservative cap',c.cap+' messages / campaign / 24 hours'],['Review policy','New and discovered contacts require eligibility review'],['Production integrations','SMTP / IMAP / DNS verification not connected']].map((r,i)=>'<div class="check"><span class="checkicon" style="color:'+(i===4?'#b28b49':'#6ba28a')+'">'+(i===4?'○':'✓')+'</span><div><b>'+r[0]+'</b><small>'+E(r[1])+'</small></div></div>').join('')+'<label style="display:flex;gap:10px;margin-top:20px;font-size:12px;line-height:1.6"><input type="checkbox" id="approvecheck"> I reviewed this saved revision and approve simulated dispatch.</label>',action('Cancel','closeModal()')+action('Approve & activate demo',"approveCampaign('"+id+"')",'primary'))}
function approveCampaign(id){if(!document.getElementById('approvecheck').checked)return toast('Review and confirm campaign approval first.');const c=state.campaigns.find(c=>c.id===id);c.status='active';c.approvedAt=new Date().toISOString();c.approvedRevision=c.revision;log('Approved campaign revision '+c.revision+': '+c.name,'Campaigns');closeModal();render();toast('Campaign approved for simulated dispatch')}
function eligible(l){return l.eligible&&['queued','followup_due'].includes(l.status)}
function sendCheck(l,c,now=Date.now()){if(state.mode!=='running')return 'Agent is '+state.mode;if(!c||c.status!=='active'||c.approvedRevision!==c.revision)return 'No approved active campaign';if(!eligible(l))return 'Lead is not eligible';if(state.sent.filter(s=>now-new Date(s.at)<86400000).length>=state.settings.cap)return 'Rolling 24-hour sender cap reached';if(state.sent.filter(s=>s.campaign===c.id&&now-new Date(s.at)<86400000).length>=c.cap)return 'Campaign cap reached';const last=state.sent.at(-1);if(last&&now-new Date(last.at)<180000)return 'Minimum 180-second dispatch spacing is active';return ''}
function simulateSend(){const c=state.campaigns.find(c=>c.status==='active'&&c.approvedRevision===c.revision);const l=state.leads.find(l=>l.status==='queued'&&l.eligible);if(!l)return toast('No eligible queued lead. Review or import leads first.');const error=sendCheck(l,c);if(error)return toast(error);const at=new Date().toISOString();state.sent.push({id:uid(),lead:l.id,campaign:c.id,at,subject:c.subject.replaceAll('{{school_name}}',l.school),body:c.body.replaceAll('{{school_name}}',l.school)});l.status='sent';l.lastSent=at;state.jobs.filter(j=>j.lead===l.id&&j.status==='queued').forEach(j=>j.status='sent');log('Demo introduction sent to '+l.school+' · '+c.name,'Dispatch');save();render();toast('Simulated send complete. No actual email was sent.')}
function followupEligible(l,now=Date.now()){return l.eligible&&['sent','followup_due'].includes(l.status)&&l.lastSent&&now-new Date(l.lastSent)>=state.settings.delay*86400000&&l.count<state.settings.max}
function draftFollowup(){const c=state.campaigns.find(c=>c.status==='active'&&c.approvedRevision===c.revision);if(!c)return toast('Approve an active campaign first.');const l=state.leads.find(l=>followupEligible(l)&&!state.drafts.some(d=>d.lead===l.id&&['pending_review','approved'].includes(d.status)));if(!l)return toast('No leads meet the '+state.settings.delay+'-day follow-up policy.');const d={id:uid(),lead:l.id,campaign:c.id,revision:c.revision,status:'pending_review',subject:c.subject.replaceAll('{{school_name}}',l.school),body:'Hello '+l.school+' team,\n\nI wanted to follow up on our introduction to JSI’s classroom solutions. Would a short conversation be useful for your team? If this is not relevant, please reply “unsubscribe” and we will stop contacting you.\n\nJSI Software Solutions\nContact: reply to this email'};state.drafts.push(d);log('Template follow-up preview generated for '+l.school+'; review required','Drafts');render();toast('Template preview ready. Local LLM is not connected.')}
function draftModal(id){const d=state.drafts.find(d=>d.id===id);openModal('Review follow-up preview','<div class="notice">Template-generated preview · Ollama not connected · Recipient and campaign are rechecked before simulated dispatch.</div><h3 style="margin-bottom:15px">'+E(d.subject)+'</h3><div class="mail">'+E(d.body)+'</div>',action('Cancel','closeModal()')+action('Approve & simulate follow-up',"sendDraft('"+id+"')",'primary'))}
function sendDraft(id){const d=state.drafts.find(d=>d.id===id);if(d.status!=='pending_review')return toast('This draft has already been processed.');const l=state.leads.find(l=>l.id===d.lead),c=state.campaigns.find(c=>c.id===d.campaign);if(!followupEligible(l)||c?.revision!==d.revision){d.status='cancelled';save();closeModal();render();return toast('Lead no longer eligible or campaign revision changed. Draft cancelled.')}const error=sendCheck({...l,status:'followup_due'},c);if(error)return toast(error);const at=new Date().toISOString();state.sent.push({id:uid(),lead:l.id,campaign:c.id,at,subject:d.subject,body:d.body});l.lastSent=at;l.count++;l.status='sent';d.status='sent';log('Follow-up approved and simulated for '+l.school,'Dispatch');closeModal();render();toast('Demo follow-up complete. No actual email was sent.')}
function simulateReply(id){const l=state.leads.find(l=>l.id===id);if(['unsubscribed','suppressed','bounced'].includes(l.status))return toast('Lead is excluded from outreach.');state.messages.unshift({id:uid(),lead:id,subject:'Interested in learning more',body:'Thank you for the introduction. Could you share more about the classroom tools and arrange an introductory conversation?',at:new Date().toISOString()});changeLead(id,'replied');state.drafts.filter(d=>d.lead===id&&d.status==='pending_review').forEach(d=>d.status='cancelled');save();toast('Reply simulated. Pending follow-ups cancelled immediately.');render()}
function inboxView(){const m=state.messages.find(m=>m.id===selectedThread)||state.messages[0];return heading('The conversation starts with a reply.','Replies are linked to schools and stop pending follow-ups automatically.',action('Simulate incoming reply','chooseReply()'))+'<section class="card" style="margin-bottom:20px"><div class="cardhead"><h2>Conversations</h2><span class="pill green">'+state.messages.length+' demo replies</span></div><div class="inboxgrid"><div class="threadlist">'+state.messages.map(t=>'<button class="thread '+(m?.id===t.id?'active':'')+'" onclick="selectedThread=\''+t.id+'\';render()"><strong>'+E(state.leads.find(l=>l.id===t.lead)?.school)+'</strong><small class="muted">'+E(t.subject)+'</small><span>'+new Date(t.at).toLocaleString()+'</span></button>').join('')+'</div><div class="cardbody">'+(m?'<span class="pill green">↩ Reply received · Follow-ups stopped</span><h2 style="margin:24px 0 10px">'+E(m.subject)+'</h2><p class="metricnote">From '+E(state.leads.find(l=>l.id===m.lead)?.email)+' · '+new Date(m.at).toLocaleString()+'</p><div class="mail" style="margin-top:22px">'+E(m.body)+'</div><p class="metricnote">Plain-text rendering · No remote images · No live IMAP connection</p>':'<div class="empty">No replies yet.</div>')+'</div></div></section>'}
function chooseReply(){const ls=state.leads.filter(l=>['sent','queued','followup_due'].includes(l.status));openModal('Simulate an incoming reply','<div class="field"><label for="replylead">Choose a fictional school</label><select id="replylead">'+ls.map(l=>'<option value="'+l.id+'">'+E(l.school)+'</option>').join('')+'</select></div><p class="metricnote">This creates a demo inbox message, marks the lead replied, and cancels pending follow-ups.</p>',action('Cancel','closeModal()')+action('Simulate reply',"simulateReply(document.getElementById('replylead').value);closeModal()",'primary'))}
function discoveryView(){const reviews=state.leads.filter(l=>l.status==='review');return heading('Find possibilities. Keep people in control.','A bounded discovery workflow with review before outreach.',action(state.discovery?'Pause discovery':'Resume discovery','toggleDiscovery()')+action('Run demo discovery','runDiscovery()', 'primary'))+'<div class="flow">'+[['01 / DISCOVER','Official sources','Bounded search & crawl'],['02 / VALIDATE','Check & deduplicate','Syntax, source and suppression'],['03 / REVIEW',reviews.length+' leads','Human eligibility review'],['04 / CONNECT','Approved outreach','Conservative sending policy']].map(r=>'<div class="card"><div class="cardbody"><span class="step">'+r[0]+'</span><b style="font-size:17px">'+r[1]+'</b><small>'+r[2]+'</small></div></div>').join('')+'</div><div class="notice">Discovery is simulated with fictional .example schools. Production discovery needs an approved search provider, robots.txt enforcement, crawl budgets, and reviewed recipient eligibility.</div><section class="card" style="margin-bottom:20px"><div class="cardhead"><div><h2>Review queue</h2><p>Sources remain attached to every discovered lead</p></div>'+badge(state.discovery?'active':'paused')+'</div><div class="tablewrap"><table><thead><tr><th>SCHOOL</th><th>SOURCE</th><th>CITY</th><th>ACTION</th></tr></thead><tbody>'+reviews.map(l=>'<tr><td><strong>'+E(l.school)+'</strong><small>'+E(l.email)+'</small></td><td>'+E(l.url||l.source)+'</td><td>'+E(l.city)+'</td><td>'+action('Review →',"reviewLead('"+l.id+"')",'textbtn')+'</td></tr>').join('')+'</tbody></table></div>'+(!reviews.length?'<div class="empty">All caught up. Run demo discovery for more schools.</div>':'')+'</section>'}
function toggleDiscovery(){state.discovery=!state.discovery;log('Discovery '+(state.discovery?'resumed':'paused'),'Discovery');render()}
function runDiscovery(){if(!state.discovery)return toast('Resume discovery first.');const n=state.leads.filter(l=>l.source==='Discovery').length+1;const school='Meadow Demo School '+n;state.leads.push({id:uid(),school,email:'office@meadow'+n+'.example',city:state.settings.region,status:'review',source:'Discovery',url:'https://meadow'+n+'.example/contact',eligible:false,count:0,lastSent:null,notes:'Simulated discovery; fictional contact'});log('Discovered '+school+'; held for human review','Discovery');render();toast('One fictional school added to the review queue')}
function assetsView(){return heading('A thoughtful introduction needs good material.','Preview your brochure workflow before connecting private storage.',action('Upload demo PDF','assetUpload()', 'primary'))+'<div class="notice">Demo uploads are checked locally for PDF header and size. Only filename and size are saved in your browser; file contents are discarded. Production requires private storage, malware scanning and signed download links. Attachments remain disabled.</div><section class="card" style="margin-bottom:20px"><div class="cardhead"><h2>Campaign assets</h2><span class="pill">PDF · up to 20 MB</span></div>'+(!state.assets.length?'<div class="empty"><div style="font-size:32px;color:#b4a2d4;margin-bottom:12px">▧</div><h3 style="margin-bottom:10px">Make your next introduction tangible.</h3><p>Upload a sample brochure to explore the asset review flow.</p></div>':'<div class="tablewrap"><table><thead><tr><th>ASSET</th><th>SIZE</th><th>STATUS</th><th></th></tr></thead><tbody>'+state.assets.map(a=>'<tr><td><strong>'+E(a.name)+'</strong><small>Metadata only · no retained file</small></td><td>'+Math.ceil(a.size/1024)+' KB</td><td>'+badge(a.status)+'</td><td>'+action('Archive',"archiveAsset('"+a.id+"')",'textbtn')+'</td></tr>').join('')+'</tbody></table></div>')+'</section>'}
function assetUpload(){openModal('Upload a sample brochure','<div class="uploadzone"><p>PDF only · 20 MB maximum · filename metadata retained</p><input type="file" accept="application/pdf,.pdf" id="assetfile" aria-label="Sample brochure PDF"></div>',action('Cancel','closeModal()')+action('Validate PDF','saveAsset()', 'primary'))}
async function saveAsset(){const f=document.getElementById('assetfile').files[0];if(!f)return toast('Choose a PDF file.');if(f.size>20*1024*1024||!/\.pdf$/i.test(f.name))return toast('Use a PDF no larger than 20 MB.');const header=await f.slice(0,5).text();if(header!=='%PDF-')return toast('Rejected: file content is not a PDF.');state.assets.push({id:uid(),name:f.name,size:f.size,status:'pending_scan'});log('PDF metadata recorded: '+f.name+'; production malware scan required','Assets');closeModal();render();toast('PDF header validated. Metadata saved; production scan pending.')}
function archiveAsset(id){const a=state.assets.find(a=>a.id===id);a.status='archived';log('Archived asset metadata: '+a.name,'Assets');render()}
function activityView(){const rows=state.events.filter(e=>!query||(e.action+' '+e.target).toLowerCase().includes(query.toLowerCase()));return heading('A clear record of every next step.','Trace imports, approvals, replies, lifecycle changes and agent controls.',action('Export activity','exportActivity()'))+'<section class="card" style="margin-bottom:20px"><div class="toolbar"><input type="search" placeholder="Search activity…" aria-label="Search activity" value="'+E(query)+'" oninput="query=this.value;document.getElementById(\'auditrows\').innerHTML=auditRows()"><span class="pill">Demo operator</span></div><div id="auditrows">'+auditRows()+'</div></section><p class="metricnote">Browser-local history is editable and is not a tamper-resistant production audit log.</p>'}
function auditRows(){return state.events.filter(e=>!query||(e.action+' '+e.target).toLowerCase().includes(query.toLowerCase())).map(e=>'<div class="auditrow"><time>'+new Date(e.at).toLocaleString()+'</time><span>'+E(e.action)+'</span><small>'+E(e.target)+'</small></div>').join('')||'<div class="empty">No matching activity.</div>'}
function exportActivity(){download('outreach-activity.csv',[['timestamp','actor','action','target'],...state.events.map(e=>[e.at,'Demo operator',e.action,e.target])].map(r=>r.map(csvCell).join(',')).join('\r\n'));toast('Activity downloaded')}
function settingsView(){return heading('Your agent. Your boundaries.','Conservative defaults and clear controls, from day one.',action('Save settings','saveSettings()', 'primary'))+'<div class="grid"><section class="card"><div class="cardhead"><h2>Sending & follow-up policy</h2><span class="pill">Demo settings</span></div><div class="cardbody"><div class="formgrid">'+field('Rolling 24-hour sender cap (1–50)','scap',state.settings.cap,'number')+field('Follow-up delay (20–30 days)','sdelay',state.settings.delay,'number')+field('Maximum follow-ups (0–2)','smax',state.settings.max,'number')+field('Low-queue threshold (1–100)','sthreshold',state.settings.threshold,'number')+field('Discovery region','sregion',state.settings.region)+field('Planned local LLM model','smodel',state.settings.model)+'</div><p class="metricnote">Simulated sends enforce a 180-second minimum interval. Production random spacing defaults to 180–360 seconds.</p></div></section><section class="card"><div class="cardhead"><h2>Agent operations</h2>'+badge(state.mode==='running'?'active':state.mode)+'</div><div class="cardbody"><div class="settingrow"><div>Demo dispatch<small>Pause without losing queued jobs</small></div>'+action(state.mode==='running'?'Pause':'Resume',"setMode('"+(state.mode==='running'?'paused':'running')+"')",'switch')+'</div><div class="settingrow"><div>Lead discovery<small>Independent from sending</small></div>'+action(state.discovery?'Pause':'Resume','toggleDiscovery()','switch')+'</div><div class="settingrow"><div>Tracking<small>Disabled by default</small></div><span class="pill">Off</span></div><div class="settingrow"><div>Direct PDF attachments<small>Disabled by default</small></div><span class="pill">Off</span></div><div style="margin-top:20px">'+action('Stop & cancel all queued sends','kill()','danger')+'</div></div></section></div><section class="card" style="margin-bottom:20px"><div class="cardhead"><div><h2>Production connections</h2><p>No secrets are collected by this public prototype</p></div><span class="pill amber">Not connected</span></div><div class="cardbody"><div class="formgrid">'+[['SMTP / IMAP','Production mail transport and reply monitoring'],['Ollama / local inference','Server-side drafting with validated structured output'],['PostgreSQL / Redis','Shared durable state and worker queues'],['Login, MFA & server RBAC','Required before any private operational deployment']].map(r=>'<div class="notice" style="margin:0"><strong>'+r[0]+'</strong><br>'+r[1]+'</div>').join('')+'</div><p class="metricnote">Intended production management URL: mailmkt.brahmexa.com. This prototype is hosted separately at yogabrata.com/outreach/.</p></div></section><div class="actions" style="margin-bottom:20px">'+action('Reset demo workspace','resetModal()')+'</div>'}
function saveSettings(){const cap=Number(document.getElementById('scap').value),delay=Number(document.getElementById('sdelay').value),max=Number(document.getElementById('smax').value),threshold=Number(document.getElementById('sthreshold').value),region=document.getElementById('sregion').value.trim(),model=document.getElementById('smodel').value.trim();if(![cap,delay,max,threshold].every(Number.isInteger)||cap<1||cap>50||delay<20||delay>30||max<0||max>2||threshold<1||threshold>100||!region||!model)return toast('Use cap 1–50, delay 20–30, follow-ups 0–2, threshold 1–100, and complete text fields.');state.settings={cap,delay,max,threshold,region,model};log('Updated non-secret demo policy settings','Settings');render();toast('Settings saved in this browser')}
function resetModal(){openModal('Reset this demo workspace?','<p style="line-height:1.8">This removes this browser’s demo changes and restores the original fictional schools, campaigns and activity. Download any CSV exports you want to keep first.</p>',action('Cancel','closeModal()')+action('Reset demo','state=seed();save();closeModal();go(\'Overview\');toast(\'Demo workspace reset\')','danger'))}
save();render();
</script></body></html>
