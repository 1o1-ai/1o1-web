<!DOCTYPE html>
<html lang="en" data-cosmic-theme="eden" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yogabrata · Inflight projects</title>
  <meta name="description" content="Yogabrata inflight projects — Elogix Americas, AI-Caregiver, 7RANGERS Hospital, and ATLAS." />
  <script>
    (function () {
      var ym_saved = "eden";
      try {
        ym_saved = localStorage.getItem("brahmexa_cosmic_theme") || localStorage.getItem("manjulab_cosmic_theme") || "eden";
      } catch (e) { /* ignore */ }
      document.documentElement.setAttribute("data-cosmic-theme", ym_saved);
      var ym_light = ym_saved === "dawn" || ym_saved === "paper" || ym_saved === "ivory";
      document.documentElement.setAttribute("data-theme", ym_light ? "light" : "dark");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="assets/theme-presets.css" />
  <link rel="stylesheet" href="assets/landing.css" />
</head>
<body class="landing-page">
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="mesh" aria-hidden="true"></div>
  <div class="orb orb-cyan" aria-hidden="true"></div>
  <div class="orb orb-orange" aria-hidden="true"></div>

  <header class="landing-header">
    <a class="manjulab-mark" href="/">
      <div class="brand-text">
        <strong>Yogabrata</strong>
        <span>Brahmexa</span>
      </div>
    </a>
  </header>

  <main class="landing-main">
    <div class="landing-tagline">
      <p>Inflight projects</p>
      <h1>Work in motion</h1>
    </div>

    <div class="portal-grid">
      <a class="portal portal--saas" href="/portal/elogix-americas/">
        <div class="portal-ring"></div>
        <div class="portal-orbit"></div>
        <div class="portal-core">
          <span class="portal-icon" aria-hidden="true">⚡</span>
          <span class="portal-title">Elogix Americas</span>
          <span class="portal-sub">AI platforms &amp; software</span>
        </div>
      </a>

      <a class="portal portal--caregiver" href="https://1o1.ai" target="_blank" rel="noopener">
        <div class="portal-ring"></div>
        <div class="portal-orbit"></div>
        <div class="portal-core">
          <span class="portal-icon" aria-hidden="true">🎙️</span>
          <span class="portal-title">AI-Caregiver</span>
          <span class="portal-sub">Full-duplex voice AI</span>
        </div>
      </a>

      <a class="portal portal--caregiver" href="/sevenrangers/index.html">
        <div class="portal-ring"></div>
        <div class="portal-orbit"></div>
        <div class="portal-core">
          <span class="portal-icon" aria-hidden="true">🏥</span>
          <span class="portal-title">7RANGERS Hospital</span>
          <span class="portal-sub">AI healthcare showcase</span>
        </div>
      </a>

      <a class="portal portal--atlas" href="https://atlas.yogabrata.com/" rel="noopener">
        <div class="portal-ring"></div>
        <div class="portal-orbit"></div>
        <div class="portal-core">
          <span class="portal-icon" aria-hidden="true">🪐</span>
          <span class="portal-title">ATLAS</span>
          <span class="portal-sub">Financial intelligence</span>
        </div>
      </a>
    </div>
  </main>

  <footer class="landing-footer">
    <p>A <a href="https://brahmexa.com">Brahmexa</a> surface</p>
  </footer>

  <script src="assets/cosmic.js"></script>
  <script src="assets/theme-picker.js"></script>
</body>
</html>
