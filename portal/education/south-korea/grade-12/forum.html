<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Discussion Forum · Brahmexa Anyo Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/theme.css?v=saas-layout-19" />

  <link rel="stylesheet" href="/assets/landing.css?v=saas-layout-12" />

  <link rel="stylesheet" href="/portal/assets/portal.css?v=11" />

  <link rel="stylesheet" href="/portal/assets/education-layout.css" />

  <link rel="stylesheet" href="/portal/education/cbse10/cbse10-forum.css" />

</head>

<body class="portal-page forum-page-full education-compact education-ambient" data-world-track="1">

  <canvas id="cosmos" aria-hidden="true"></canvas>

  <div class="mesh" aria-hidden="true"></div>



  <header class="portal-header">

    <a class="back-link" href="index.html">← Track hub</a>

    <h1>Discussion Forum</h1>

  </header>



  <main class="portal-main forum-main forum-main-full">

    <div class="forum-toolbar">

      <div class="forum-filters">

        <label for="forumSubject">Subject</label>

        <select id="forumSubject"><option value="all">All</option></select>

        <label for="forumChapter">Chapter</label>

        <select id="forumChapter"><option value="all">All chapters</option></select>

      </div>

      <p class="forum-stats" id="forumStats"></p>

    </div>

    <section class="forum-content forum-content-full">

      <div id="threadList" class="thread-list"></div>

      <article id="threadDetail" class="thread-detail forum-hidden" aria-hidden="true">

        <button type="button" class="back-link" id="btnBackList" style="border:none;background:none;cursor:pointer;margin-bottom:12px">← All threads</button>

        <h2 id="threadTitle"></h2>

        <p id="threadMeta" class="hint"></p>

        <div id="threadPosts"></div>

      </article>

    </section>

  </main>



  <script src="/assets/cosmic.js?v=brand-phase4-1"></script>

  <script src="/portal/assets/education-ambient.js"></script>

  <script

    src="/portal/education/assets/anyo-education-bootstrap.js?v=4"

    data-page-scripts="/portal/education/assets/world-track-forum.js?v=2"

  ></script>

</body>

</html>
