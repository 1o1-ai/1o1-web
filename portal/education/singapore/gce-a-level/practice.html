<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice Tests · Brahmexa Anyo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css?v=saas-layout-19" />
  <link rel="stylesheet" href="/assets/landing.css?v=saas-layout-12" />
  <link rel="stylesheet" href="/portal/assets/portal.css?v=11" />
  <link rel="stylesheet" href="/portal/assets/education-layout.css" />
  <link rel="stylesheet" href="/portal/education/cbse10/cbse10-study-room.css" />
</head>
<body class="portal-page study-room-page education-compact education-ambient" data-world-track="1">
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="mesh" aria-hidden="true"></div>

  <header class="portal-header">
    <a class="back-link" href="index.html">← Track hub</a>
    <h1>Practice Tests</h1>
  </header>

  <main class="portal-main" style="max-width:820px">
    <p class="portal-note">Quick drills from ingested knowledge — 5 questions per subject.</p>
    <section class="practice-card">
      <label for="prSubject">Subject</label>
      <select id="prSubject"></select>
      <button type="button" class="btn-portal btn-portal-primary" id="btnStart" style="width:100%;margin-top:12px">Start practice drill</button>
      <p class="hint" id="prStats" style="margin-top:12px"></p>
    </section>
    <section class="practice-card hidden" id="prActive">
      <h2 id="prQuestion">Question</h2>
      <div id="prBody"></div>
      <div class="sr-eval-actions" style="margin-top:12px">
        <button type="button" class="btn-portal btn-portal-primary" id="btnReveal">Reveal answer</button>
        <button type="button" class="btn-portal btn-portal-ghost" id="btnNext" hidden>Next</button>
      </div>
    </section>
  </main>

  <script src="/assets/cosmic.js?v=brand-phase4-1"></script>
  <script src="/portal/assets/education-ambient.js"></script>
  <script
    src="/portal/education/assets/anyo-education-bootstrap.js?v=4"
    data-page-scripts="/portal/education/assets/world-track-practice.js?v=5"
  ></script>
</body>
</html>
