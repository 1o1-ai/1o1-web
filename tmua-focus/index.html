<style>

px;margin:12px 0}.wrong{background:#fbefe2}.nav{margin:14px 0}.nav button{min-width:35px;padding:5px 9px}.nav .current{outline:2px solid #17473b;outline-offset:2px}.review{border-top:1px solid #d6dfd6;padding-top:12px;margin:14px 0}summary{cursor:pointer;font-weight:650}a{color:#245e4a}#timer{font-variant-numeric:tabular-nums;font-weight:750}

.course-nav{margin-bottom:20px}.course-nav [aria-current="page"]{background:#17473b;color:white}.section-title{margin-top:32px}.card p:last-child{margin-bottom:0}.study-copy{max-width:70ch}.stat{display:block;font-size:28px;font-weight:800}.course-nav button{flex:0 1 auto}.bookmarked{background:#f8e8ad;color:#262410}textarea{display:block;width:100%;min-height:82px;font:inherit;padding:8px;border:1px solid #82978c;border-radius:8px;margin:5px 0 12px}select,input[type=number]{font:inherit;padding:7px;border:1px solid #82978c;border-radius:8px}meter{width:100%;height:12px}.session>details{margin-bottom:16px}

<body><header><div class="row between"><a class="brand" href="./">TMUA <span>Focus</span></a><nav class="row" aria-label="Site navigation"><a href="./help.html">Help</a><a href="/">All projects</a></nav></div></header>
<main id="app"></main><footer>Progress is saved in this browser. · Independent practice for university applicants · <a href="https://esat-tmua.ac.uk/about-the-tests/tmua-test/" target="_blank" rel="noopener">Official UAT-UK test information</a></footer>
<script src="course.js"></script>
<script src="profiles.js?v=5"></script>
<script src="emotional.js?v=2"></script>
<script src="registration.js?v=2"></script>
<script>
const p1='Paper 1 · Applications';
const p2='Paper 2 · Reasoning';
const bank=[];
function add(paper,topic,prompt,correct,wrong,why){
  const options=[...wrong];
  options.splice((bank.length*3+1)%5,0,correct);
  bank.push({id:bank.length,paper,topic,prompt,correct,options,why});
}
for(const n of [2,3,4,5,6]){
  add(p1,'Algebra','The roots of x² − '+(2*n+1)+'x + '+n*(n+1)+' = 0 are a and b. Find a² + b².',
    ''+(n*n+(n+1)**2),[''+(2*n+1)**2,''+(2*n+1),''+(2*n*(n+1)),''+(n*n+n)],
    'Use a² + b² = (a + b)² − 2ab. The sum of the roots is '+(2*n+1)+' and their product is '+n*(n+1)+'.');
  add(p1,'Functions','Let f(x) = x² − '+2*n+'x + '+(n*n+3)+'. For how many distinct real x does f(x) = '+(n*n+3)+'?',
    '2',['0','1','3','Infinitely many'],'Subtract the constant and factor x(x − '+2*n+') = 0. Both roots are distinct.');
  add(p1,'Sequences','An arithmetic sequence has third term '+(n+4)+' and seventh term '+(n+12)+'. Find the sum of its first '+n+' terms.',
    ''+(n*(2*n-1)),[''+(n*n),''+(n*(2*n-1)+n),''+(n*(2*n-1)+2*n),''+(n*(2*n-1)+1)],
    'Four steps add 8, so the common difference is 2. The first term is '+n+' and the last is '+(3*n-2)+'. The average is '+(2*n-1)+'.');
  add(p1,'Coordinate geometry','A line meets the positive x-axis at x = '+2*n+' and the positive y-axis at y = '+(n+1)+'. Find the area enclosed with the axes.',
    ''+(n*(n+1)),[''+(2*n*(n+1)),''+(n*n),''+(n+1),''+(n*(n+2))],
    'The axes form the perpendicular sides of the triangle. Its area is half the product of the intercepts.');
  add(p2,'Implications','For an integer k, let P mean “'+(2*n)+' divides k” and Q mean “'+n+' divides k”. Which claim is true?',
    'P is sufficient for Q',['Q is sufficient for P','P is necessary for Q','P and Q are equivalent','Neither implies the other'],
    'Every multiple of '+(2*n)+' is a multiple of '+n+'. Taking k = '+n+' shows the converse fails.');
  add(p2,'Counterexamples','Which integer disproves the claim “If x² > '+n*n+', then x > '+n+'”?',
    ''+(-n-1),[''+(-n),''+n,''+(n+1),'0'],
    'A counterexample satisfies the hypothesis and fails the conclusion. The negative integer '+(-n-1)+' has absolute value greater than '+n+'.');
  add(p2,'Negation','Which statement is the negation of “Every integer greater than '+n+' has property R”?',
    'Some integer greater than '+n+' lacks R',['Every integer greater than '+n+' lacks R','Some integer at most '+n+' lacks R','Every integer at most '+n+' has R','Some integer greater than '+n+' has R'],
    'Negating a universal statement requires one counterexample from the same domain.');
  add(p2,'Proof and logic','A proof uses the fact that x > '+n+'. Which replacement is logically equivalent for real x?',
    'x − '+n+' > 0',['x² > '+n*n,'|x| > '+n,'x ≥ '+n,'x + '+n+' > 0'],
    'Subtracting the same number from both sides preserves a strict inequality and is reversible.');
}
const legacyMap={'Algebra':'MM1','Functions':'MM1','Sequences':'MM2','Coordinate geometry':'MM3','Implications':'Arg','Counterexamples':'Err','Negation':'Arg','Proof and logic':'Prf'};
for(const q of bank){q.module=legacyMap[q.topic];q.level='Foundation'}
for(const [code,paper,prompt,correct,wrong,hint,why] of authored){
  const module=modules.find(item=>item[0]===code);
  add(paper===1?p1:p2,module[1],prompt,correct,wrong.split('|'),why);
  Object.assign(bank.at(-1),{module:code,level:paper===2?'Reasoning':'Application',hint});
}
const app=document.querySelector('#app');
const key='tmua-focus-v1';
const profileKey='tmua-focus-active-profile';
const empty=()=>({sessions:0,answered:0,right:0,missed:[]});
const defaultStudy=()=>({lessons:[],stats:{},notes:{},due:{},history:[],weeks:6,cards:{},seen:{},attempts:[],baseline:null,stuck:'',emotional:{},eqChoices:{},eqDraft:null,eqSection:0,eqOnboarding:null,baselineDraft:null,reasons:{},coach:{minutes:25,need:'general',confidence:3,reflection:''}});
let profile=ownProfile,progress,study,session=null,clock,full=null;
function loadProfile(id){
  profile=profiles.find(item=>item.id===id)??ownProfile;
  ({progress,study}=seedProfile(profile));
  try{
    const saved=JSON.parse(localStorage.getItem('tmua-focus-profile-v1:'+profile.id)??'null');
    if(saved){
      progress=saved.progress;
      study={...study,...saved.study,coach:{...study.coach,...saved.study.coach}};
    }else if(profile.id==='mine'){
      progress=JSON.parse(localStorage.getItem(key))||progress;
      study={...study,...JSON.parse(localStorage.getItem('tmua-focus-course-v1'))};
    }
  }catch{}
}
function saveStudy(){
  try{localStorage.setItem('tmua-focus-profile-v1:'+profile.id,JSON.stringify({progress,study}))}catch{}
}
try{
  const registered=JSON.parse(localStorage.getItem(registeredKey)??'[]');
  if(Array.isArray(registered))profiles.push(...registered.filter(item=>typeof item?.id==='string'&&item.id.startsWith('student-')));
}catch{}
let activeId;
try{activeId=localStorage.getItem(profileKey)}catch{}
loadProfile(activeId);
const formatDay=value=>new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
const button=(label,action,extra='secondary')=>'<button type="button" class="'+extra+'" data-action="'+action+'">'+label+'</button>';
const names={plan:'Study plan',onboarding:'Onboarding',profile:'Student profile',emotional:'Social & emotional',baseline:'Learning Baseline',learn:'Learn',practice:'Practice',review:'Mistake notebook',resources:'Resources'};
const navBar=page=>`<div class="row between profile-bar"><label>Student <select id="active-profile">${profiles.map(item=>`<option value="${item.id}" ${item.id===profile.id?'selected':''}>${esc(item.name)}${demoProfiles.includes(item)?' · demo':''}</option>`).join('')}</select></label><div class="row"><span class="muted">${esc(profile.city)}</span>${button('Register student','register')}</div></div><nav class="row course-nav" aria-label="Study sections">${Object.entries(names).map(([id,label])=>'<button class="secondary" data-action="'+id+'" '+(page===id?'aria-current="page"':'')+'>'+label+'</button>').join('')}</nav>`;
function coachingPanel(recommendation,checkIn=false){
  const {minutes,need,confidence,reflection}=study.coach;
  return `<section class="coach"><h2>Your next study session</h2><p class="question">${esc(recommendation.title)}</p><p>${esc(recommendation.reason)}</p>${button(recommendation.label,recommendation.action,'')}
  ${eqCoachingTip()}
  ${checkIn?`<details class="section-title"><summary>Tell your coach how today is going</summary><form id="coach-checkin" class="coach-form"><label>Time available<select name="minutes">${[10,15,20,25,35,45].map(n=>`<option value="${n}" ${n===minutes?'selected':''}>${n} minutes</option>`).join('')}</select></label><label>What should we work on?<select name="need">${Object.entries(needs).map(([id,label])=>`<option value="${id}" ${id===need?'selected':''}>${label}</option>`).join('')}</select></label><label>How confident do you feel?<select name="confidence">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===confidence?'selected':''}>${n}/5${n===1?' · Unsure':n===5?' · Very confident':''}</option>`).join('')}</select></label><label>Personal reflection <textarea name="reflection" maxlength="500" placeholder="What happened in your last practice session?">${esc(reflection)}</textarea></label><button>Update my session</button></form></details>`:''}</section>`;
}
const title=(heading,body)=>`<h1 tabindex="-1">${heading}</h1><p class="study-copy muted">${body}</p>`;
const retryButton=ids=>ids.length?button('Retry '+ids.length+' questions','retry',''):'';
const missedIds=()=>progress.missed.filter(id=>bank[id]);
const dueIds=()=>missedIds().filter(id=>!study.due[id]||study.due[id]<=Date.now());
function home(page='plan'){
  clearInterval(clock);
  session=null;
  full=null;
  const recommendation=getRecommendation();
  const recent=study.history.slice(-5).reverse().map(item=>`<li>${formatDay(item.at)} · ${esc(item.label)} · ${item.right}/${item.total}</li>`).join('');
  const windowWeeks=Number(study.weeks);
  const stages=[
    ['Baseline and foundations','Take the diagnostic, then work through exact calculation, algebra, ratio and core graphs.'],
    ['Applications and reasoning','Alternate a maths module with logic, proof and error spotting. Explain each solution before checking it.'],
    ['Timed practice and review','Sit original mocks and official past papers. Rework missed and slow questions without looking at your notes.'],
    ['Final rehearsal','Complete the Pearson practice player on desktop, then run both papers back to back. Check booking, ID and approved access arrangements.']
  ];
  const plan=stages.map(([heading,body],i)=>{
    const first=Math.min(windowWeeks,1+Math.floor(i*windowWeeks/4));
    const last=Math.max(first,Math.floor((i+1)*windowWeeks/4));
    return `<section class="card"><p class="eyebrow">Week ${first}${last>first?'–'+last:''}</p><h3>${heading}</h3><p>${body}</p></section>`;
  }).join('');
  const pages={
    register:page==='register'?registrationPage():'',
    onboarding:page==='onboarding'?onboardingPage():'',
    'eq-checkin':page==='eq-checkin'?eqCheckinPage():'',
    emotional:page==='emotional'?emotionalPage():'',
    baseline:study.baseline?baselineSummary()+baselineSetup():baselineSetup(),
    plan:`<section class="hero"><p class="eyebrow">${esc(profile.name)} · ${demoProfiles.includes(profile)?'Sample student':'Your workspace'}</p><h1>Learn the maths. Practise the reasoning.</h1><p>Build a study plan, cover the syllabus and rehearse both papers before test day.</p><div class="row">${button(study.baseline?'View Learning Baseline':'Start Learning Baseline','baseline','light')}${button('Explore the syllabus','learn')}</div></section>
    <div class="grid"><section class="card"><strong class="stat">${study.lessons.length}/${modules.length}</strong>Lessons read</section><section class="card"><strong class="stat">${dueIds().length}</strong>Mistakes ready to retry</section><section class="card"><strong class="stat">${progress.answered?Math.round(100*progress.right/progress.answered)+'%':'—'}</strong>Practice accuracy</section></div>
    ${coachingPanel(recommendation,true)}
    <h2 class="section-title">Preparation schedule</h2><label>Weeks available <select id="weeks">${[4,6,8,12].map(n=>`<option ${n===windowWeeks?'selected':''}>${n}</option>`).join('')}</select></label><div class="grid">${plan}</div>
    <h2>Recent practice</h2>${recent?'<ul>'+recent+'</ul>':'<p>Completed sessions will appear here.</p>'}`,
    profile:title(esc(profile.name),esc(profile.city+' · '+profile.course))+
    `<p>${demoProfiles.includes(profile)?'Fictional student with sample results. Activities you complete here update this demo profile only.':'Your practice and reflections are stored in this browser.'}</p><div class="grid"><section class="card"><strong class="stat">${study.weeks}</strong>Weeks in study plan</section><section class="card"><strong class="stat">${study.coach.minutes}</strong>Minutes available today</section><section class="card"><strong class="stat">${study.coach.confidence}/5</strong>Confidence at check-in</section></div>
    ${coachingPanel(recommendation,true)}
    ${study.baseline?baselineSummary():button('Take the Learning Baseline','baseline')}
    ${coachingInsight()}
    <section class="coach"><h2>Social and emotional learning</h2><p>Explore study habits, feedback, pressure and working with others.</p>${button('Open the coaching profile','emotional')}</section>
    <h2 class="section-title">Skill record</h2><div class="skill-grid">${modules.map(([code,name])=>{
      const stat=study.stats[code];
      return `<section class="skill"><h3>${name}</h3>${stat?.total?`<meter min="0" max="${stat.total}" value="${stat.right}" aria-label="${name} accuracy"></meter><p>${stat.right}/${stat.total} correct${stat.timed?' · '+Math.round(stat.seconds/stat.timed)+'s avg timed':''}</p>`:'<p>Awaiting first attempt</p>'}</section>`;
    }).join('')}</div><h2 class="section-title">Recent practice</h2>${recent?'<ul>'+recent+'</ul>':'<p>Complete a session to build your record.</p>'}`,
    learn:title('Syllabus and lessons','Work through all 18 major syllabus areas. Each lesson has a method, a worked example, a common trap, a recall prompt and targeted practice.')+
    ['Pure mathematics','Core mathematics','Paper 2 reasoning'].map((group,i)=>`<h2 class="section-title">${group}</h2><div class="grid">${modules.slice([0,8,15][i],[8,15,18][i]).map(([code,name,goal])=>{
      const stat=study.stats[code];
      return `<section class="card"><p class="eyebrow">${code} · ${study.lessons.includes(code)?'Read':'To study'}</p><h3>${name}</h3><p>${goal}</p>${stat?`<p>${stat.right}/${stat.total} correct in practice</p>`:''}${button('Open lesson','lesson-'+code)}</section>`;
    }).join('')}</div>`).join(''),
    practice:title('Practise for the test','Work without a calculator. The official test has two consecutive 75-minute papers of 20 questions each. There is no penalty for wrong answers.')+
    `<p>${button('Start an 18-question diagnostic','diagnostic')}</p><div class="grid"><section class="card"><h3>Paper 1</h3><p>Apply school mathematics in unfamiliar settings.</p><div class="row">${button('Quick drill','drill1')}${button('75-minute mock','paper1','')}</div></section>
    <section class="card"><h3>Paper 2</h3><p>Test mathematical arguments, proof steps and counterexamples.</p><div class="row">${button('Quick drill','drill2')}${button('75-minute mock','paper2','')}</div></section>
    <section class="card"><h3>Full rehearsal</h3><p>Both original practice papers back to back, 150 minutes total. Review solutions after both papers.</p>${button('Start full rehearsal','full','')}</section></div>
    <section class="card"><h3>Strategy for timed papers</h3><p>Use the first pass to answer questions where you have a clear route. Flag uncertain items. On the second pass, use sketches, sign checks and simple cases to rule out distractors. Leave time to answer every item.</p><p>Mocks reuse questions from the learning bank and report raw marks. Use the official past-paper archive for unfamiliar full papers and the Pearson player for interface practice.</p>${button('Open official resources','resources')}</section>`,
    review:title('Mistake notebook','Write down what went wrong and what you will check next time. Retry a mistake after one day, then again after three days once you get it right.')+
    `<div class="row">${dueIds().length?button('Practice due questions','due',''):''}${retryButton(missedIds())}</div>
    ${missedIds().length?missedIds().map(id=>{const q=bank[id];return `<section class="card review"><h3>${esc(q.topic)}</h3><p>${esc(q.prompt)}</p><p class="muted">${study.due[id]>Date.now()?'Scheduled for '+formatDay(study.due[id]):'Ready to retry'}</p><label for="note-${id}">My correction</label><textarea id="note-${id}" data-note="${id}">${esc(study.notes[id]??'')}</textarea><details><summary>Show worked answer</summary><p>${esc(q.correct)}. ${esc(q.why)}</p></details></section>`}).join(''):'<p>Complete a practice session to start your notebook.</p>'}`,
    resources:title('Official papers and study resources','Use the syllabus for coverage, official questions for calibration and the Pearson practice player for test-day navigation.')+
    '<div class="grid">'+resources.map(([label,source,detail,url])=>`<section class="card"><p class="eyebrow">${source}</p><h3><a target="_blank" rel="noopener" href="${url}">${label}</a></h3><p>${detail}</p></section>`).join('')+'</div>'
  };
  app.innerHTML=navBar(page)+pages[page];
}
function lesson(code){
  const module=modules.find(item=>item[0]===code);
  if(!module)return;
  const [,name,goal,method,example,trap]=module;
  const q=bank.find(item=>item.module===code&&item.hint);
  app.innerHTML=navBar('learn')+`<article class="session"><p class="eyebrow">${code}</p><h2 tabindex="-1">${esc(name)}</h2><p>${esc(goal)}</p><h3>Method</h3><p>${esc(method)}</p><h3>Worked example</h3><p>${esc(example)}</p><h3>Common trap</h3><p>${esc(trap)}</p><details><summary>Recall prompt</summary><p>${esc(q.prompt)}</p><details><summary>Reveal answer</summary><p>${esc(q.correct)}. ${esc(q.why)}</p></details></details><div class="row">${button('Practise this topic','topic-'+code,'')}${button(study.lessons.includes(code)?'Lesson marked as read':'Mark lesson as read','read-'+code)}</div></article>`;
  app.querySelector('h2').focus();
}
function start(mode){
  clearInterval(clock);
  const original=bank.filter(q=>q.hint);
  const rotated=(items,offset)=>[...items.slice(offset%items.length),...items.slice(0,offset%items.length)];
  const selection=(paper,count,offset)=>rotated(original.filter(q=>q.paper===paper),offset).slice(0,count);
  const side=mode.endsWith('1')?p1:p2;
  const timed=mode.startsWith('paper')||mode.startsWith('pace-')||mode==='full'||mode==='onboarding';
  let questions;
  if(mode==='onboarding'){
    questions=['MM1','Arg','MM8','Prf','MM4','Err','M7','Arg'].map((code,i)=>{
      const options=original.filter(q=>q.module===code);
      return options[(i===7?1:0)+(study.baseline?1:0)];
    });
  }
  else if(mode==='retry')questions=missedIds().map(id=>bank[id]);
  else if(mode==='due')questions=dueIds().map(id=>bank[id]);
  else if(mode==='verify'){
    questions=[];
    const topics=new Set();
    for(const attempt of fragileAttempts().reverse()){
      const source=bank[attempt.id];
      if(topics.has(source.module))continue;
      const candidates=bank.filter(q=>q.module===source.module&&q.id!==source.id&&q.hint)
        .sort((a,b)=>(study.seen[a.id]??0)-(study.seen[b.id]??0));
      questions.push(candidates[0]??source);
      topics.add(source.module);
      if(questions.length>=Math.max(2,Math.floor(study.coach.minutes/4)))break;
    }
  }
  else if(mode.startsWith('due-'))questions=dueIds().map(id=>bank[id]).filter(q=>q.module===mode.slice(4)).slice(0,Math.max(2,Math.floor(study.coach.minutes/4)));
  else if(mode==='diagnostic'||mode==='mini'){
    const codes=mode==='mini'?['MM1','MM4','MM6','M7','Arg','Err']:modules.map(([code])=>code);
    questions=codes.map(code=>original.find(q=>q.module===code));
  }else if(mode.startsWith('coach-')||mode.startsWith('pace-')){
    const code=mode.split('-')[1];
    const limit=mode.startsWith('pace-')&&study.eqChoices.pressure==='Use shorter timed drills'?3:6;
    const count=Math.max(2,Math.min(limit,Math.floor(study.coach.minutes/4)));
    questions=bank.filter(q=>q.module===code).sort((a,b)=>(study.seen[a.id]??0)-(study.seen[b.id]??0)||Number(Boolean(b.hint))-Number(Boolean(a.hint))).slice(0,count);
  }
  else if(mode.startsWith('topic-'))questions=bank.filter(q=>q.module===mode.slice(6));
  else if(mode==='full'){
    questions=selection(p1,20,progress.sessions);
    full={next:selection(p2,20,progress.sessions),first:[],answers:{}};
  }else questions=selection(side,timed?20:5,progress.sessions*5);
  if(!questions.length)return;
  const started=Date.now();
  session={started,questions,mode,timed,idx:0,answers:{},checked:{},flags:{},confidence:{},seconds:{},since:Date.now(),deadline:started+(mode==='onboarding'?12*60000:mode.startsWith('pace-')?questions.length*225000:75*60000),ended:false};
  saveBaselineDraft();
  render();
  if(timed&&!session.ended){updateTimer();clock=setInterval(updateTimer,250)}
}
function saveBaselineDraft(){
  if(session?.mode!=='onboarding'||session.ended)return;
  const {questions,...draft}=session;
  study.baselineDraft={...draft,ids:questions.map(q=>q.id)};
  saveStudy();
}
function resumeBaseline(){
  const draft=study.baselineDraft;
  if(!draft){home('baseline');return}
  const questions=draft.ids.map(id=>bank[id]);
  if(questions.some(q=>!q)){study.baselineDraft=null;saveStudy();home('baseline');return}
  clearInterval(clock);
  session={...draft,questions,since:Math.min(Date.now(),draft.deadline)};
  render();
  if(!session.ended)clock=setInterval(updateTimer,250);
}
function updateTimer(){
  const ms=session.deadline-Date.now();
  if(ms<=0){session.expired=true;finish();return}
  const seconds=Math.ceil(ms/1000);
  const timer=document.querySelector('#timer');
  if(timer)timer.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function recordTime(){
  if(!session.timed)return;
  const now=Math.min(Date.now(),session.deadline);
  const id=session.questions[session.idx].id;
  session.seconds[id]=(session.seconds[id]??0)+Math.max(0,now-session.since)/1000;
  session.since=now;
}
function render(){
  const {questions,idx,answers,checked,timed,flags}=session;
  const q=questions[idx],chosen=answers[q.id],locked=checked[q.id];
  const nav=questions.map((item,i)=>button((i+1)+(flags[item.id]?' ⚑':''),'go'+i,
    (answers[item.id]===undefined?'secondary':'')+(idx===i?' current':''))).join('');
  app.innerHTML=`<section class="session"><div class="row between"><p class="eyebrow">${q.paper} · ${esc(profile.name)}</p>${timed?'<span id="timer" aria-label="Time remaining"></span>':''}</div>
  <h2 tabindex="-1">Question ${idx+1} of ${questions.length}</h2><p class="muted">${q.topic}</p>
  <p class="question" id="question">${esc(q.prompt)}</p>
  <fieldset class="options" aria-labelledby="question">${q.options.map((value,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${chosen===value?'checked':''} ${locked?'disabled':''}> ${esc(value)}</label>`).join('')}</fieldset>
  ${(!timed||session.mode==='onboarding')?`<p><label>How sure are you? <select id="answer-confidence" ${locked?'disabled':''}><option value="">Choose confidence</option>${[['guess','Guessing'],['unsure','Partly sure'],['sure','Confident']].map(([value,label])=>`<option value="${value}" ${session.confidence[q.id]===value?'selected':''}>${label}</option>`).join('')}</select></label></p>`:''}
  ${!timed&&!locked&&q.hint?`<details><summary>Show hint</summary><p>${esc(q.hint)}</p></details>`:''}
  ${locked?`<div class="feedback ${chosen===q.correct?'':'wrong'}"><strong>${chosen===q.correct?'Correct':'Correct answer · '+esc(q.correct)}</strong><br>${esc(q.why)}</div>`:''}
  <div class="row">${idx?button('Previous','prev'):''}${!timed&&!locked?'<button data-action="check" '+(chosen===undefined?'disabled':'')+'>Check answer</button>':''}${idx+1<questions.length?button('Next','next'):''}${button(flags[q.id]?'Remove flag':'Flag for review','flag',flags[q.id]?'bookmarked':'secondary')}</div>
  <div class="row nav" aria-label="Question navigation">${nav}</div>
  <div class="row between">${button(session.mode==='onboarding'?'Save and exit':'Exit practice','exit')}${button(full?.next?'Submit Paper 1 and start Paper 2':'Finish and review','finish','')}</div></section>`;
  app.querySelector('h2').focus();
  if(timed)updateTimer();
}
function finish(){
  if(session.ended)return;
  recordTime();
  session.ended=true;
  clearInterval(clock);
  if(full?.next){
    full.first=session.questions;
    full.answers=session.answers;
    full.seconds=session.seconds;
    const next=full.next;
    full.next=null;
    const deadline=Math.min(session.deadline,Date.now())+75*60000;
    session={questions:next,mode:'full',timed:true,idx:0,answers:{},checked:{},flags:{},confidence:{},seconds:{},since:Math.min(Date.now(),deadline),deadline,ended:false};
    render();
    if(!session.ended)clock=setInterval(updateTimer,250);
    return;
  }
  const questions=full?[...full.first,...session.questions]:session.questions;
  const answers=full?{...full.answers,...session.answers}:session.answers;
  const seconds={...full?.seconds,...session.seconds};
  const retrying=session.mode==='retry'||session.mode==='due'||session.mode.startsWith('due-');

  let right=0,answered=0;
  const missed=new Set(progress.missed);
  const breakdown={};
  const reviews=questions.map(q=>{
    const answer=answers[q.id],correct=answer===q.correct;
    if(answer!==undefined)answered++;
    const topic=study.stats[q.module]??={right:0,total:0};
    topic.total++;
    study.seen[q.id]=Date.now();
    if(session.mode==='verify'&&correct&&session.confidence[q.id]==='sure'){
      study.attempts=study.attempts.map(attempt=>bank[attempt.id].module===q.module?{...attempt,confirmed:true}:attempt);
    }
    study.attempts.push({id:q.id,correct,answered:answer!==undefined,timed:session.timed,
      confidence:answer!==undefined?(session.confidence[q.id]??''):''});
    if(answer!==undefined&&session.timed){
      topic.seconds=(topic.seconds??0)+(seconds[q.id]??0);
      topic.timed=(topic.timed??0)+1;
    }
    if(correct){
      right++;
      topic.right++;
      if(retrying&&(study.due[q.id]??0)<=Date.now()&&!study.cards[q.id]){
        study.cards[q.id]=true;
        study.due[q.id]=Date.now()+3*86400000;
      }else if(!retrying||(study.due[q.id]??0)<=Date.now()){
        missed.delete(q.id);
        delete study.due[q.id];
        delete study.cards[q.id];
      }
    }else{
      missed.add(q.id);
      study.due[q.id]=Date.now()+86400000;
      delete study.cards[q.id];
    }
    const stat=breakdown[q.paper]??=[0,0];
    stat[0]+=Number(correct);stat[1]++;
    return `<details class="review"><summary>${correct?'Correct':answer===undefined?'Unanswered':'Missed'} · ${esc(q.topic)} · ${esc(q.prompt)}</summary><p>Your answer: ${esc(answer??'Skipped')}<br>Correct answer: ${esc(q.correct)}</p><p>${esc(q.why)}</p>${correct?'':`<label>What went wrong? <select data-reason="${q.id}"><option value="">Choose a reason</option>${Object.entries(mistakeReasons).map(([value,label])=>`<option value="${value}" ${study.reasons[q.id]===value?'selected':''}>${label}</option>`).join('')}</select></label>`}</details>`;
  }).join('');
  progress={sessions:progress.sessions+1,answered:progress.answered+questions.length,right:progress.right+right,missed:[...missed]};
  study.attempts=study.attempts.slice(-240);
  if(session.mode==='onboarding'){
    study.baselineDraft=null;
    study.baseline={right,total:questions.length,answered,applications:breakdown[p1],reasoning:breakdown[p2],
      elapsed:Math.floor((Math.min(Date.now(),session.deadline)-session.started)/1000),expired:Boolean(session.expired),
      rated:questions.filter(q=>answers[q.id]!==undefined&&session.confidence[q.id]).length,
      guesses:questions.filter(q=>answers[q.id]===q.correct&&session.confidence[q.id]==='guess').length,
      confidentMisses:questions.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==q.correct&&session.confidence[q.id]==='sure').length,
      firstMiss:questions.find(q=>answers[q.id]!==q.correct)?.id};
    study.sessionAfterBaseline=progress.sessions;
  }
  const label={onboarding:'Learning Baseline',verify:'Confidence check',diagnostic:'Diagnostic',mini:'Short baseline',full:'Full rehearsal',paper1:'Paper 1 mock',paper2:'Paper 2 mock',retry:'Mistake review',due:'Scheduled review'}[session.mode]??(session.mode.startsWith('pace-')?'Timed topic drill':'Topic practice');
  study.history.push({at:Date.now(),label,right,total:questions.length});
  study.history=study.history.slice(-50);
  saveStudy();
  full=null;
  app.innerHTML=`<section class="session"><h2 tabindex="-1">${right} of ${questions.length} correct</h2><p>${answered} answered · ${questions.length-answered} skipped · Raw practice score</p>${Object.entries(breakdown).map(([paper,[good,total]])=>`<p>${paper} · ${good}/${total}</p>`).join('')}<div class="row">${button('Study plan','home')}${button('Open notebook','review')}${missed.size?button('Retry missed questions','retry',''):''}</div>${coachingPanel(getRecommendation(),true)}${session.mode==='onboarding'?baselineSummary()+button('Continue onboarding','onboarding','') : ''}<div>${reviews}</div></section>`;
  app.querySelector('h2').focus();
}
app.addEventListener('change',event=>{
  const {target}=event;
  if(target.id==='answer-confidence'){
    if(session.timed&&Date.now()>=session.deadline){session.expired=true;finish();return}
    session.confidence[session.questions[session.idx].id]=target.value;
    saveBaselineDraft();
    return;
  }
  if(target.dataset?.reason!==undefined){
    study.reasons[target.dataset.reason]=target.value;
    saveStudy();
    const panel=app.querySelector('.coach');
    if(panel)panel.outerHTML=coachingPanel(getRecommendation(),true);
    return;
  }
  if(target.id==='active-profile'){
    loadProfile(target.value);
    try{localStorage.setItem(profileKey,profile.id)}catch{}
    home('profile');
    return;
  }
  if(target.id==='weeks'){study.weeks=Number(target.value);saveStudy();home();return}
  if(event.target.name!=='answer' ||!session||session.ended)return;
  if(session.timed&&Date.now()>=session.deadline){session.expired=true;finish();return}
  const q=session.questions[session.idx];
  session.answers[q.id]=q.options[Number(event.target.value)];
  saveBaselineDraft();
  const check=app.querySelector('[data-action="check"]');
  if(check)check.disabled=false;
  app.querySelector('[data-action="go'+session.idx+'"]').classList.remove('secondary');
});
app.addEventListener('submit',event=>{
  if(event.target.id==='register-student'){
    event.preventDefault();
    const form=new FormData(event.target);
    const name=String(form.get('name')??'').trim().slice(0,50);
    const status=app.querySelector('#register-status');
    if(!name){status.textContent='Enter a student name or nickname.';return}
    const student={id:'student-'+crypto.randomUUID(),name,
      city:String(form.get('city')??'').trim().slice(0,60)||'Personal workspace',
      course:String(form.get('course')??'').trim().slice(0,65)||'TMUA preparation'};
    try{localStorage.setItem(registeredKey,JSON.stringify([...profiles.filter(item=>item.id.startsWith('student-')),student]))}
    catch{status.textContent='This browser could not save the profile. Check its storage settings and try again.';return}
    profiles.push(student);
    loadProfile(student.id);
    try{localStorage.setItem(profileKey,student.id)}catch{}
    home('onboarding');
    app.querySelector('h1').focus();
    return;
  }
  if(event.target.id==='eq-checkin-form'){
    event.preventDefault();
    const form=new FormData(event.target);
    const intent=event.submitter?.value??'save';
    const draft={...(study.eqDraft??study.eqChoices)};
    const [,aspects]=emotionalGroups[study.eqSection];
    for(const [id] of aspects){
      const answer=form.get(id);
      if(eqOptions[id].includes(answer))draft[id]=answer;
      else if(answer!==null&&answer!==undefined)delete draft[id];
    }
    study.eqDraft=draft;
    let next='eq-checkin';
    if(intent==='skip'){
      study.eqDraft=null;
      study.eqSection=0;
      study.eqOnboarding=eqAnswerCount()?'completed':'skipped';
      next='onboarding';
    }else if(intent==='pause'){
      next='onboarding';
    }else if(intent==='back'){
      study.eqSection=Math.max(0,study.eqSection-1);
    }else if(study.eqSection+1<eqSectionCount()){
      study.eqSection++;
    }else{
      study.eqChoices=draft;
      study.eqDraft=null;
      study.eqSection=0;
      study.eqOnboarding=eqAnswerCount()?'completed':'skipped';
      next='onboarding';
    }
    saveStudy();
    home(next);
    app.querySelector('h1').focus();
    return;
  }
  const aspect=event.target.dataset?.emotional;
  if(aspect){
    event.preventDefault();
    const reflection=String(new FormData(event.target).get('reflection')??'').trim().slice(0,300);
    if(reflection)study.emotional[aspect]=reflection;
    else delete study.emotional[aspect];
    saveStudy();
    home('emotional');
    app.querySelector('#eq-'+aspect).open=true;
    app.querySelector('#eq-'+aspect+' summary').focus();
    app.querySelector('#saved-'+aspect).textContent=reflection?'Check-in saved.':'Check-in cleared.';
    return;
  }
  if(event.target.id==='baseline-setup'){
    event.preventDefault();
    const value=new FormData(event.target).get('stuck');
    study.stuck=Object.hasOwn(stuckOptions,value)?value:'';
    saveStudy();
    if(event.submitter?.value==='save')home('plan');
    else start('onboarding');
    return;
  }
  if(event.target.id!=='coach-checkin')return;
  event.preventDefault();
  const form=new FormData(event.target);
  const need=form.get('need');
  study.sessionAfterBaseline=null;
  study.coach={minutes:Number(form.get('minutes')),need:Object.hasOwn(needs,need)?need:'general',
    confidence:Number(form.get('confidence')),reflection:String(form.get('reflection')??'').trim().slice(0,500)};
  saveStudy();
  home('profile');
  app.querySelector('h1').focus();
});
app.addEventListener('input',event=>{
  if(event.target.dataset.note===undefined)return;
  study.notes[event.target.dataset.note]=event.target.value;
  saveStudy();
});
app.addEventListener('click' ,event=>{
  const action=event.target.closest('button')?.dataset.action;
  if(!action)return;
  if(action==='home'||action==='register'||action==='eq-checkin'||Object.hasOwn(names,action)){home(action==='home'?'plan':action);return}
  if(action==='resume-baseline'){resumeBaseline();return}
  if(action.startsWith('role-')){
    const id=action.slice(5);
    const prompt=rolePlays[id];
    if(prompt){
      app.innerHTML=navBar('emotional')+`<article class="session"><h2 tabindex="-1">Study partner role-play</h2><p>${esc(prompt)}</p><form class="coach-form" data-emotional="${id}"><label>Your response<textarea name="reflection" maxlength="300">${esc(study.emotional[id]??'')}</textarea></label><div class="row"><button>Save response</button>${button('Return to coaching profile','emotional')}</div></form></article>`;
      app.querySelector('h2').focus();
    }
    return;
  }
  if(action.startsWith('lesson-')){lesson(action.slice(7));return}
  if(action.startsWith('read-')){
    const code=action.slice(5);
    if(!study.lessons.includes(code))study.lessons.push(code);
    saveStudy();
    lesson(code);
    return;
  }
  if(['diagnostic','drill1','drill2','paper1','paper2','retry','due','full','verify'].includes(action)||action==='mini'||/^(topic|coach|pace|due)-/.test(action)){start(action);return}
  if(session.timed&&Date.now()>=session.deadline){session.expired=true;finish();return}
  if(action==='exit'){
    if(session.mode==='onboarding'){
      recordTime();
      saveBaselineDraft();
      home('onboarding');
    }else if(confirm('Leave this session? Current answers will be discarded.'))home();
    return;
  }
  if(action==='finish'){if(Object.keys(session.answers).length===session.questions.length||confirm('Finish with unanswered questions?'))finish();return}
  if(action==='check')session.checked[session.questions[session.idx].id]=true;
  if(action==='flag'){
    const id=session.questions[session.idx].id;
    session.flags[id]=!session.flags[id];
  }
  if(action==='prev'||action==='next'||action.startsWith('go'))recordTime();
  if(action==='prev')session.idx--;
  if(action==='next')session.idx++;
  if(action.startsWith('go'))session.idx=Number(action.slice(2));
  saveBaselineDraft();
  render();
});
const requestedView=new URLSearchParams(globalThis.location?.search).get('view');
home(requestedView==='register'||Object.hasOwn(names,requestedView)?requestedView:
  profile.id.startsWith('student-')&&(!study.baseline||!study.eqOnboarding)?'onboarding':'plan');
</script></body></html>
